# ServiceEnv 定义：prod、base、dev 三环境
# Fallback 从 namespace 注解 serviceenv.zaeyi.com/fallback-env 读取（见 00-namespace.yaml）
---
apiVersion: serviceenv.zaeyi.com/v1
kind: ServiceEnv
metadata:
  name: prod
  namespace: serviceenv-test
spec:
  envName: prod
  description: "生产环境"
  enabled: true
---
apiVersion: serviceenv.zaeyi.com/v1
kind: ServiceEnv
metadata:
  name: base
  namespace: serviceenv-test
spec:
  envName: base
  description: "基准环境（namespace 兜底 fallback 目标）"
  enabled: true
---
apiVersion: serviceenv.zaeyi.com/v1
kind: ServiceEnv
metadata:
  name: dev
  namespace: serviceenv-test
spec:
  envName: dev
  description: "开发环境"
  enabled: true
