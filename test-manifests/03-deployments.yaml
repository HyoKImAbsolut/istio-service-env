# 测试 Deployments
# httpbin: prod/base/dev 均有，验证环境隔离
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-prod
  namespace: serviceenv-test
  labels:
    serviceenv.zaeyi.com/env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      serviceenv.zaeyi.com/env: prod
  template:
    metadata:
      labels:
        app: httpbin
        app.kubernetes.io/name: httpbin
        app.kubernetes.io/version: v1
        serviceenv.zaeyi.com/env: prod
    spec:
      containers:
        - name: httpbin
          image: traefik/whoami
          imagePullPolicy: IfNotPresent
          args: ["--port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-base
  namespace: serviceenv-test
  labels:
    serviceenv.zaeyi.com/env: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      serviceenv.zaeyi.com/env: base
  template:
    metadata:
      labels:
        app: httpbin
        app.kubernetes.io/name: httpbin
        app.kubernetes.io/version: v1
        serviceenv.zaeyi.com/env: base
    spec:
      containers:
        - name: httpbin
          image: traefik/whoami
          imagePullPolicy: IfNotPresent
          args: ["--port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-dev
  namespace: serviceenv-test
  labels:
    serviceenv.zaeyi.com/env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      serviceenv.zaeyi.com/env: dev
  template:
    metadata:
      labels:
        app: httpbin
        app.kubernetes.io/name: httpbin
        app.kubernetes.io/version: v2
        serviceenv.zaeyi.com/env: dev
    spec:
      containers:
        - name: httpbin
          image: traefik/whoami
          imagePullPolicy: IfNotPresent
          args: ["--port=8080"]
          ports:
            - containerPort: 8080
