# Kubernetes Services
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: serviceenv-test
spec:
  ports:
    - port: 8000
      name: http
      targetPort: 80
  selector:
    app: httpbin
---
apiVersion: v1
kind: Service
metadata:
  name: fallback-target
  namespace: serviceenv-test
spec:
  ports:
    - port: 8000
      name: http
      targetPort: 80
  selector:
    app: fallback-target
