apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceenvs.serviceenv.zaeyi.com
spec:
  group: serviceenv.zaeyi.com
  names:
    kind: ServiceEnv
    plural: serviceenvs
    singular: serviceenv
    shortNames: [senv]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [envName]
            properties:
              envName:
                type: string
              fallbackEnv:
                type: string
                description: "Fallback environment when service not in current env"
              description:
                type: string
              enabled:
                type: boolean
                default: true
          status:
            type: object
            properties:
              services:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    version:
                      type: string
              phase:
                type: string
              message:
                type: string
              lastUpdateTime:
                type: string
              istioConfigured:
                type: boolean
    subresources:
      status: {}
