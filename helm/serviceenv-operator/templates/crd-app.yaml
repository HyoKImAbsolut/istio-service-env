apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.serviceenv.zaeyi.com
spec:
  group: serviceenv.zaeyi.com
  names:
    kind: App
    plural: apps
    singular: app
    shortNames: [app]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [appName]
            properties:
              appName:
                type: string
                description: "App name, must match Deployment's app.kubernetes.io/name"
              description:
                type: string
          status:
            type: object
            properties:
              envs:
                type: array
                items:
                  type: string
              phase:
                type: string
              message:
                type: string
              lastUpdateTime:
                type: string
    subresources:
      status: {}
