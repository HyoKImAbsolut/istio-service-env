{{- if .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "serviceenv-operator.fullname" . }}
  labels:
    {{- include "serviceenv-operator.labels" . | nindent 4 }}
rules:
  # ServiceEnv CRD权限
  - apiGroups:
      - serviceenv.zaeyi.com
    resources:
      - serviceenvs
      - serviceenvs/status
      - serviceenvs/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Pod权限
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  # Deployment权限
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch

  # Service权限
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch

  # Namespace权限
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch

  # Istio VirtualService权限
  - apiGroups:
      - networking.istio.io
    resources:
      - virtualservices
      - virtualservices/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Istio DestinationRule权限
  - apiGroups:
      - networking.istio.io
    resources:
      - destinationrules
      - destinationrules/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Events权限（用于记录事件）
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "serviceenv-operator.fullname" . }}
  labels:
    {{- include "serviceenv-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "serviceenv-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "serviceenv-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
