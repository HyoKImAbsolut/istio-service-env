# 镜像配置
# 注意：repository 必须全部小写（Docker 规范要求）
image:
  repository: ghcr.io/hyokimabsolut/serviceenv-operator
  tag: ""  # 留空则使用 Chart.appVersion，也可通过 --set image.tag=xxx 覆盖
  pullPolicy: IfNotPresent

# 副本数
replicas: 1

# 资源限制
resources:
  limits:
    memory: 256Mi
    cpu: 200m
  requests:
    memory: 128Mi
    cpu: 50m
