apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceenv-operator
  namespace: default
  labels:
    app: serviceenv-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serviceenv-operator
  template:
    metadata:
      labels:
        app: serviceenv-operator
    spec:
      serviceAccountName: serviceenv-operator
      containers:
        - name: operator
          image: serviceenv-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JAVA_OPTS
              value: ""
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: serviceenv-operator
  namespace: default
  labels:
    app: serviceenv-operator
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: serviceenv-operator
