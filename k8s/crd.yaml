apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceenvs.serviceenv.zaeyi.com
spec:
  group: serviceenv.zaeyi.com
  names:
    kind: ServiceEnv
    listKind: ServiceEnvList
    plural: serviceenvs
    shortNames:
      - senv
    singular: serviceenv
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - envName
              properties:
                envName:
                  type: string
                  description: "Unique environment name"
                fallbackEnv:
                  type: string
                  description: "Fallback environment name when service not found in current environment"
                description:
                  type: string
                  description: "Description of this environment"
                enabled:
                  type: boolean
                  default: true
                  description: "Whether this environment is enabled"
            status:
              type: object
              properties:
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      podCount:
                        type: integer
                      version:
                        type: string
                phase:
                  type: string
                  description: "Environment phase: Pending, Active, Disabled, Error"
                message:
                  type: string
                lastUpdateTime:
                  type: string
                istioConfigured:
                  type: boolean
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Env
          type: string
          jsonPath: .spec.envName
        - name: Fallback
          type: string
          jsonPath: .spec.fallbackEnv
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Services
          type: integer
          jsonPath: .status.services[*].name
          priority: 1
        - name: Istio
          type: boolean
          jsonPath: .status.istioConfigured
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
