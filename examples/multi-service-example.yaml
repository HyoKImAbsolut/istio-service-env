# 多服务示例：prod、base、dev，仅 dev fallback 到 base

---
# 环境定义
apiVersion: serviceenv.zaeyi.com/v1
kind: ServiceEnv
metadata:
  name: prod
spec:
  envName: prod
  description: "生产环境"
  enabled: true

---
apiVersion: serviceenv.zaeyi.com/v1
kind: ServiceEnv
metadata:
  name: base
spec:
  envName: base
  description: "基准环境"
  enabled: true

---
apiVersion: serviceenv.zaeyi.com/v1
kind: ServiceEnv
metadata:
  name: dev
spec:
  envName: dev
  fallbackEnv: base
  description: "开发环境"
  enabled: true

---
# 生产环境服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
      serviceenv.zaeyi.com/env: prod
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
        serviceenv.zaeyi.com/env: prod
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:v1
          ports:
            - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
      serviceenv.zaeyi.com/env: prod
  template:
    metadata:
      labels:
        app: order-service
        version: v1
        serviceenv.zaeyi.com/env: prod
    spec:
      containers:
        - name: order-service
          image: order-service:v1
          ports:
            - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
      serviceenv.zaeyi.com/env: prod
  template:
    metadata:
      labels:
        app: payment-service
        version: v1
        serviceenv.zaeyi.com/env: prod
    spec:
      containers:
        - name: payment-service
          image: payment-service:v1
          ports:
            - containerPort: 8080

---
# base 环境服务（dev fallback 目标）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
      serviceenv.zaeyi.com/env: base
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
        serviceenv.zaeyi.com/env: base
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:v1
          ports:
            - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
      serviceenv.zaeyi.com/env: base
  template:
    metadata:
      labels:
        app: order-service
        version: v1
        serviceenv.zaeyi.com/env: base
    spec:
      containers:
        - name: order-service
          image: order-service:v1
          ports:
            - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
      serviceenv.zaeyi.com/env: base
  template:
    metadata:
      labels:
        app: payment-service
        version: v1
        serviceenv.zaeyi.com/env: base
    spec:
      containers:
        - name: payment-service
          image: payment-service:v1
          ports:
            - containerPort: 8080

---
# dev 环境的 payment-service 新版本
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
      serviceenv.zaeyi.com/env: dev
  template:
    metadata:
      labels:
        app: payment-service
        version: v2-dev
        serviceenv.zaeyi.com/env: dev
    spec:
      containers:
        - name: payment-service
          image: payment-service:v2-dev
          ports:
            - containerPort: 8080

---
# Kubernetes Services
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: api-gateway

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: order-service

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: payment-service

---
# 测试说明
#
# 调用链：api-gateway -> order-service -> payment-service
#
# 使用 dev 环境测试：
# curl -H "x-service-env: dev" http://api-gateway:8080/api/order
#
# 路由行为（dev fallback 到 base）：
# 1. api-gateway: 无 dev 版本 -> fallback 到 base
# 2. order-service: 无 dev 版本 -> fallback 到 base
# 3. payment-service: 有 dev 版本 -> 使用 dev
#
# 整个链路保持 x-service-env: dev
