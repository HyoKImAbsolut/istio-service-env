name: Build and Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          cache: 'gradle'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          # 转换 repository owner 为小写（Docker 要求）
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner_lower }}/serviceenv-operator:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner_lower }}/serviceenv-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/serviceenv-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${{ steps.version.outputs.version }}/" helm/serviceenv-operator/Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm Chart
        run: helm package helm/serviceenv-operator -d .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: serviceenv-operator-${{ steps.version.outputs.version }}.tgz
          generate_release_notes: true

      - name: Push Helm Chart to OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push serviceenv-operator-${{ steps.version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ steps.version.outputs.owner_lower }}/charts
