name: CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: false
        type: string
      push_to_registry:
        description: 'Push to OCI registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HELM_VERSION: v3.14.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine build type
        id: build_type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            VERSION="${{ github.event.inputs.version }}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "version_number=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi
          echo "Build type: is_release=${{ steps.build_type.outputs.is_release }}"

      - name: Update version in gradle.properties
        if: steps.build_type.outputs.is_release == 'true'
        run: |
          sed -i "s/^version=.*/version=${{ steps.build_type.outputs.version_number }}/" gradle.properties
          cat gradle.properties

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint Helm Chart
        run: helm lint helm/serviceenv-operator

      - name: Test Helm Chart rendering
        run: |
          helm template test-release helm/serviceenv-operator \
            --namespace test-namespace \
            --set image.tag=test

      # ==================== Release Steps (only for tags) ====================
      
      - name: Set up Docker Buildx
        if: steps.build_type.outputs.is_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.build_type.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.build_type.outputs.is_release == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/serviceenv-operator
          tags: |
            type=semver,pattern={{version}},value=${{ steps.build_type.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.build_type.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.build_type.outputs.is_release == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.build_type.outputs.version_number }}

      - name: Update Helm Chart version
        if: steps.build_type.outputs.is_release == 'true'
        run: |
          sed -i "s/^version:.*/version: ${{ steps.build_type.outputs.version_number }}/" helm/serviceenv-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.build_type.outputs.version_number }}\"/" helm/serviceenv-operator/Chart.yaml
          cat helm/serviceenv-operator/Chart.yaml

      - name: Package Helm Chart
        if: steps.build_type.outputs.is_release == 'true'
        run: |
          helm package helm/serviceenv-operator --destination .helm-releases
          ls -lh .helm-releases/

      - name: Generate Helm Chart index
        if: steps.build_type.outputs.is_release == 'true'
        run: |
          helm repo index .helm-releases --url https://github.com/${{ github.repository }}/releases/download/${{ steps.build_type.outputs.version }}

      - name: Push Helm Chart to OCI Registry
        if: steps.build_type.outputs.is_release == 'true' && github.event.inputs.push_to_registry != 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push .helm-releases/serviceenv-operator-${{ steps.build_type.outputs.version_number }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Create Release
        if: steps.build_type.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.build_type.outputs.version }}
          name: Release ${{ steps.build_type.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .helm-releases/*.tgz
            .helm-releases/index.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.build_type.outputs.is_release }}" = "true" ]; then
            echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: ${{ steps.build_type.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Docker Image**: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/serviceenv-operator:${{ steps.build_type.outputs.version_number }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Helm Chart (Release)**: \`serviceenv-operator-${{ steps.build_type.outputs.version_number }}.tgz\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Helm Chart (OCI)**: \`oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/serviceenv-operator\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Installation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**方式1: 从 OCI Registry 安装（推荐）**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "helm install serviceenv-operator \\" >> $GITHUB_STEP_SUMMARY
            echo "  oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/serviceenv-operator \\" >> $GITHUB_STEP_SUMMARY
            echo "  --version ${{ steps.build_type.outputs.version_number }} \\" >> $GITHUB_STEP_SUMMARY
            echo "  --namespace serviceenv-system \\" >> $GITHUB_STEP_SUMMARY
            echo "  --create-namespace" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**方式2: 从 Release Assets 安装**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "wget https://github.com/${{ github.repository }}/releases/download/${{ steps.build_type.outputs.version }}/serviceenv-operator-${{ steps.build_type.outputs.version_number }}.tgz" >> $GITHUB_STEP_SUMMARY
            echo "helm install serviceenv-operator serviceenv-operator-${{ steps.build_type.outputs.version_number }}.tgz \\" >> $GITHUB_STEP_SUMMARY
            echo "  --namespace serviceenv-system \\" >> $GITHUB_STEP_SUMMARY
            echo "  --create-namespace" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ CI Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Build**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Tests**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Helm Lint**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 **提示**: 推送 Git Tag 以触发发布流程" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "git tag v0.1.0" >> $GITHUB_STEP_SUMMARY
            echo "git push origin v0.1.0" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
